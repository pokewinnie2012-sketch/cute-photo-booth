<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ย้อนเวลาก่อนซอมบี้บุก EP.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#07060a; --fg:#f4eee8; --accent:#e2263a; --muted:#9a93a3; --panel:rgba(12,10,16,.72); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#07060a; --fg:#f4eee8; } }
  :root[data-theme="dark"] { --bg:#07060a; --fg:#f4eee8; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:Kanit, Loma, sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #wrap { position:relative; width:min(100vw, calc(100dvh * 9 / 16)); aspect-ratio:9/16; }
  canvas { display:block; width:100%; height:100%; background:#000; }
  #start { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
           background:rgba(0,0,0,.55); border:0; color:var(--fg); font:600 20px Kanit, sans-serif; cursor:pointer; }
  #start .btn { width:84px; height:84px; border-radius:50%; background:var(--accent); display:grid; place-items:center;
                box-shadow:0 0 40px rgba(226,38,58,.6); }
  #start .btn::after { content:""; margin-left:8px; border-left:30px solid #fff; border-top:19px solid transparent; border-bottom:19px solid transparent; }
  #start small { color:var(--muted); font-weight:400; font-size:14px; }
  #bar { position:absolute; left:0; right:0; bottom:0; padding:10px 12px 12px; display:flex; gap:10px; align-items:center;
         background:linear-gradient(transparent, rgba(0,0,0,.8)); opacity:0; transition:opacity .25s; }
  #wrap:hover #bar, #bar.show { opacity:1; }
  #bar button { background:var(--panel); color:var(--fg); border:1px solid rgba(255,255,255,.15); border-radius:8px;
                font:600 14px Kanit, sans-serif; padding:6px 10px; cursor:pointer; min-width:44px; }
  #seek { flex:1; accent-color:var(--accent); }
  #time { font-size:13px; color:var(--muted); min-width:84px; text-align:right; font-variant-numeric:tabular-nums; }
  body.export #start, body.export #bar { display:none; }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <canvas id="cv" width="1080" height="1920"></canvas>
    <button id="start" aria-label="เล่น"><span class="btn"></span>แตะเพื่อดู EP.2<small>เปิดเสียงด้วยนะ</small></button>
    <div id="bar">
      <button id="pp">❚❚</button>
      <button id="rs">↺</button>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="ตำแหน่ง">
      <span id="time">0:00 / 0:00</span>
    </div>
  </div>
</div>
<script>
'use strict';
/* =========================================================================
   ย้อนเวลา ก่อนซอมบี้บุกเตรียมพัฒน์ — EP.2
   Deterministic canvas animation: renderAt(t) draws any frame, buildAudio()
   synthesizes the soundtrack, so playback and MP4 export use the same code.
   ========================================================================= */
const W = 1080, H = 1920, TOTAL = 86;
const cv = document.getElementById('cv');
const c = cv.getContext('2d');
const FONT = 'Kanit, Loma, sans-serif';

/* ---------- math helpers ---------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;
const backOut = t => { const k = 1.70158; return 1 + (k + 1) * Math.pow(t - 1, 3) + k * Math.pow(t - 1, 2); };
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function hex2rgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(x => x + x).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; }

/* ---------- drawing helpers ---------- */
function rr(x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function ell(x, y, rx, ry, rot = 0) { c.beginPath(); c.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, Math.PI * 2); c.fill(); }
function circ(x, y, r) { ell(x, y, r, r); }
function poly(pts) { c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.closePath(); c.fill(); }
function vgrad(y0, y1, stops) { const g = c.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; }
function cam(cx, cy, z) { c.translate(W / 2, H / 2); c.scale(z, z); c.translate(-cx, -cy); }

const segmenter = (typeof Intl !== 'undefined' && Intl.Segmenter) ? new Intl.Segmenter('th', { granularity: 'word' }) : null;
function wrap(str, maxW) {
  const lines = [];
  for (const para of str.split('\n')) {
    const words = segmenter ? [...segmenter.segment(para)].map(s => s.segment) : para.split(/(\s+)/);
    let line = '';
    for (const w of words) {
      const test = line + w;
      if (/^[\s…!?.,)”]+$/.test(w)) { line = test; continue; } // never start a line with punctuation
      if (c.measureText(test).width > maxW && line.trim()) { lines.push(line.trimEnd()); line = w.trimStart(); }
      else line = test;
    }
    lines.push(line);
  }
  return lines;
}
function text(str, x, y, o = {}) {
  c.save();
  c.font = `${o.weight || 800} ${o.size || 60}px ${FONT}`;
  c.textAlign = o.align || 'center'; c.textBaseline = 'middle';
  const lines = o.maxW ? wrap(str, o.maxW) : str.split('\n');
  const lh = (o.size || 60) * (o.lh || 1.28);
  const y0 = y - (lines.length - 1) * lh / 2;
  lines.forEach((ln, i) => {
    const yy = y0 + i * lh;
    if (o.glow) { c.shadowColor = o.glow; c.shadowBlur = o.glowBlur || 30; }
    if (o.stroke) { c.lineJoin = 'round'; c.strokeStyle = o.stroke; c.lineWidth = o.strokeW || 12; c.strokeText(ln, x, yy); }
    c.fillStyle = o.color || '#fff'; c.fillText(ln, x, yy);
    c.shadowBlur = 0;
  });
  c.restore();
  return lines.length * lh;
}

/* =========================================================================
   CHARACTERS
   ========================================================================= */
const PHUM = { skin: '#f1c7a1', hair: 'spiky', hairColor: '#17161f', bottom: 'shorts', pants: '#1f2c4d', iris: '#3b2a20' };
const MINT = { skin: '#f8d5bd', hair: 'long', hairColor: '#2b1913', bottom: 'skirt', pants: '#22305a', bow: '#22305a', iris: '#5a3220', clip: '#ff7aa8' };
const TEACHER = { skin: '#ecc19c', hair: 'bun', hairColor: '#2e2a2a', top: '#8e6bb8', bottom: 'longskirt', pants: '#2f2a3a', glasses: true, iris: '#2c1e18' };
const TAE = { skin: '#e2b48a', hair: 'buzz', hairColor: '#121212', bottom: 'shorts', pants: '#1f2c4d', iris: '#2a1a12' };
const HOOD = { skin: '#c9a184', hair: 'hood', hairColor: '#0b0b10', top: '#15151d', bottom: 'pants', pants: '#101016' };
const EXTRAS = [
  { skin: '#eab890', hair: 'bob', hairColor: '#1d130f', bottom: 'skirt', pants: '#22305a', bow: '#22305a' },
  { skin: '#f3cdb0', hair: 'spiky', hairColor: '#3a2a20', bottom: 'shorts', pants: '#1f2c4d' },
  { skin: '#d9a77c', hair: 'buzz', hairColor: '#0e0e0e', bottom: 'shorts', pants: '#1f2c4d' },
  { skin: '#f6d2b8', hair: 'long', hairColor: '#120d0b', bottom: 'skirt', pants: '#22305a', bow: '#22305a' },
  { skin: '#e5b38c', hair: 'bob', hairColor: '#3b2416', bottom: 'skirt', pants: '#22305a', bow: '#22305a' },
  { skin: '#efc4a0', hair: 'buzz', hairColor: '#2a1c14', bottom: 'shorts', pants: '#1f2c4d' },
];

/* st: {x,y,s,face,walk,walkAmt,armF,armB,eyes,mouth,brows,zombie,tear,tilt,rot,look,sil,hold,blush,sweat,bob} */
function person(p, st) {
  const s = st.s ?? 1, f = st.face ?? 1, z = st.zombie ?? 0, sil = st.sil;
  const C = col => sil || col;
  const skin = C(z > 0 ? mix(p.skin, '#8f9f78', z) : p.skin);
  c.save();
  c.translate(st.x, st.y);
  if (st.shadow !== false && !sil) { c.fillStyle = 'rgba(0,0,0,.22)'; ell(0, 0, 95 * s, 16 * s); }
  c.scale(s * f, s);
  c.rotate(st.rot || 0);
  const wa = st.walkAmt || 0, wp = st.walk || 0;
  c.translate(0, -Math.abs(Math.sin(wp)) * 16 * wa + (st.bob || 0));
  const swing = Math.sin(wp) * 0.6 * wa;

  leg(p, 24, -swing, skin, C); leg(p, -24, swing, skin, C);
  const sleeve = C(z > 0 ? mix(p.top || '#fbfbf8', '#b9b28f', z * .6) : (p.top || '#fbfbf8'));
  arm(p, -60, st.armB ?? (swing * .9 + .08), skin, sleeve, null, z, C);

  // torso
  c.fillStyle = sleeve; rr(-68, -340, 136, 182, 30); c.fill();
  if (!sil) {
    c.fillStyle = 'rgba(20,20,60,.07)'; rr(14, -340, 54, 182, 26); c.fill();
    if (p.hair !== 'hood' && !p.top) { // school emblem + name embroidery
      c.fillStyle = '#2d4fa3'; circ(-34, -292, 8); c.fillRect(22, -296, 30, 4);
    }
    if (z > 0) {
      c.globalAlpha = z * .85; c.fillStyle = '#7a1d18';
      ell(-20, -250, 26, 18, .4); ell(25, -205, 18, 26, -.3); ell(-40, -190, 12, 9); ell(10, -300, 10, 14);
      c.globalAlpha = 1;
    }
  }
  if (p.bottom === 'shorts' || p.bottom === 'pants') { c.fillStyle = C(p.pants); rr(-70, -186, 140, 44, 10); c.fill(); if (!sil) { c.fillStyle = '#111'; c.fillRect(-70, -186, 140, 9); } }
  if (p.bottom === 'skirt' || p.bottom === 'longskirt') {
    const bot = p.bottom === 'skirt' ? -86 : -30;
    c.fillStyle = C(p.pants); poly([-66, -192, 66, -192, 98, bot, -98, bot]);
    if (!sil) { c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = 3; for (let i = -3; i <= 3; i++) { c.beginPath(); c.moveTo(i * 18, -188); c.lineTo(i * 27, bot); c.stroke(); } }
  }
  // collar / bow
  if (!sil && p.hair !== 'hood') {
    if (p.bow) {
      c.fillStyle = '#fff'; poly([-40, -342, 0, -312, 40, -342, 30, -322, 0, -300, -30, -322]);
      c.fillStyle = p.bow; poly([0, -318, -34, -334, -30, -300]); poly([0, -318, 34, -334, 30, -300]);
      poly([-8, -316, 8, -316, 16, -262, 0, -270, -16, -262]); circ(0, -318, 9);
    } else if (!p.top) {
      c.fillStyle = '#fff'; c.strokeStyle = 'rgba(0,0,0,.18)'; c.lineWidth = 3;
      c.beginPath(); c.moveTo(-44, -342); c.lineTo(0, -300); c.lineTo(-10, -340); c.closePath(); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(44, -342); c.lineTo(0, -300); c.lineTo(10, -340); c.closePath(); c.fill(); c.stroke();
    } else {
      c.fillStyle = 'rgba(255,255,255,.85)'; poly([-30, -342, 0, -318, 30, -342, 0, -330]);
    }
  }
  arm(p, 60, st.armF ?? (-swing * .9 + .08), skin, sleeve, st.hold, z, C, st.scratch);

  // head
  c.save(); c.translate(0, -418); c.rotate(st.tilt || 0); c.translate(0, 418);
  head(p, st, skin, z, C, sil);
  c.restore();
  c.restore();
}

function leg(p, x, a, skin, C) {
  c.save(); c.translate(x, -176); c.rotate(-a);
  c.fillStyle = (p.bottom === 'pants') ? C(p.pants) : skin; rr(-20, 0, 40, 160, 18); c.fill();
  if (p.bottom === 'shorts') { c.fillStyle = C(p.pants); rr(-25, -6, 50, 78, 10); c.fill(); }
  if (p.bottom === 'longskirt') { c.fillStyle = C(p.pants); rr(-24, -6, 48, 140, 14); c.fill(); }
  if (p.bottom !== 'pants') { c.fillStyle = C('#f4f4f4'); rr(-20, 118, 40, 40, 8); c.fill(); }
  c.fillStyle = C('#141414'); rr(-24, 150, 60, 26, 12); c.fill();
  c.restore();
}

function arm(p, x, a, skin, sleeve, hold, z, C, scratch) {
  c.save(); c.translate(x, -322); c.rotate(-a);
  c.fillStyle = (p.hair === 'hood' || p.longSleeve) ? sleeve : skin; rr(-16, 0, 32, 150, 16); c.fill();
  c.fillStyle = sleeve; rr(-21, -8, 42, 64, 16); c.fill();
  c.fillStyle = skin; circ(0, 150, 20);
  if (z > .5 && !p.sil) { c.fillStyle = 'rgba(90,20,15,.7)'; circ(4, 156, 9); }
  if (hold === 'ext') { // fire extinguisher
    c.save(); c.translate(0, 150); c.rotate(a - .2);
    c.fillStyle = C('#d0202a'); rr(-26, -10, 52, 120, 20); c.fill();
    c.fillStyle = C('#ffffff'); c.fillRect(-26, 30, 52, 22);
    c.fillStyle = C('#222'); c.fillRect(-10, -26, 20, 20); rr(4, -30, 70, 12, 6); c.fill();
    c.restore();
  }
  if (scratch && !p.sil) {
    c.strokeStyle = '#b0101a'; c.lineWidth = 4; c.lineCap = 'round';
    for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(-13, 84 + i * 13); c.lineTo(13, 96 + i * 13); c.stroke(); }
  }
  if (hold === 'bat') {
    c.save(); c.translate(0, 150);
    c.fillStyle = C('#c08a4a'); rr(-9, -30, 18, 210, 9); c.fill(); rr(-14, 90, 28, 96, 14); c.fill();
    c.fillStyle = C('#222'); c.fillRect(-10, -30, 20, 26);
    c.restore();
  }
  if (hold === 'flash') {
    c.save(); c.translate(0, 150);
    c.fillStyle = C('#333'); rr(-12, -10, 24, 60, 6); c.fill();
    c.globalCompositeOperation = 'lighter';
    const g = c.createLinearGradient(0, 45, 0, 1200); g.addColorStop(0, 'rgba(255,245,200,.45)'); g.addColorStop(1, 'rgba(255,245,200,0)');
    c.fillStyle = g; poly([-10, 45, 10, 45, 300, 1200, -300, 1200]);
    c.globalCompositeOperation = 'source-over';
    c.restore();
  }
  if (hold === 'phone') {
    c.save(); c.translate(0, 150); c.rotate(a);
    c.fillStyle = C('#111'); rr(-22, -60, 44, 84, 8); c.fill();
    c.fillStyle = C('#5fb4ff'); rr(-18, -55, 36, 72, 6); c.fill();
    c.restore();
  }
  c.restore();
}

function head(p, st, skin, z, C, sil) {
  const hc = C(z > 0 ? mix(p.hairColor, '#3b3b2c', z * .5) : p.hairColor);
  const ex = 8 + (st.look || 0) * 4;
  // back hair
  c.fillStyle = hc;
  if (p.hair === 'long') { rr(-100, -488, 200, 240, [90, 90, 40, 40]); c.fill(); }
  if (p.hair === 'bob') { rr(-98, -488, 196, 150, [90, 90, 30, 30]); c.fill(); }
  if (p.hair === 'bun') { circ(-6, -512, 40); }
  if (p.hair === 'hood') { c.fillStyle = C(p.top); ell(0, -420, 112, 120); }
  if (p.hoodDown) { c.fillStyle = C(p.top); ell(0, -350, 112, 46); }
  // neck
  c.fillStyle = skin; rr(-18, -356, 36, 40, 8); c.fill();
  // face
  if (p.hair === 'hood') { c.fillStyle = sil || '#050507'; ell(0, -405, 72, 78); }
  else { c.fillStyle = skin; ell(0, -418, 82, 86); ell(-80, -410, 12, 18); ell(80, -410, 12, 18); }

  if (!sil && p.hair !== 'hood') {
    if (st.blush || p.clip) { c.fillStyle = `rgba(255,110,130,${st.blush ?? .35})`; ell(-46 + ex, -372, 16, 9); ell(50 + ex, -372, 16, 9); }
    if (z > 0) {
      c.globalAlpha = z; c.strokeStyle = '#4b5a3a'; c.lineWidth = 3;
      c.beginPath(); c.moveTo(-60, -380); c.lineTo(-42, -360); c.lineTo(-50, -340); c.moveTo(56, -440); c.lineTo(40, -420); c.lineTo(52, -400); c.stroke();
      c.fillStyle = 'rgba(60,40,60,.45)'; ell(-31 + ex, -386, 20, 9); ell(31 + ex, -386, 20, 9);
      c.globalAlpha = 1;
    }
    eyes(p, st, ex, z);
    brows(st, ex, z, hc);
    c.strokeStyle = 'rgba(120,60,40,.5)'; c.lineWidth = 3; c.beginPath(); c.moveTo(ex + 6, -392); c.lineTo(ex + 10, -380); c.stroke();
    mouth(st, ex, z);
    if (p.scar) { c.strokeStyle = 'rgba(160,70,70,.85)'; c.lineWidth = 4; c.beginPath(); c.moveTo(-60 + ex, -452); c.lineTo(-34 + ex, -372); c.stroke(); }
    if (st.tear) tears(st.tear, ex, st.t || 0);
    if (st.sweat) { c.fillStyle = 'rgba(150,210,255,.9)'; ell(78, -455 + Math.sin((st.t || 0) * 6) * 4, 10, 16); }
    if (p.glasses) { c.strokeStyle = '#3a2a2a'; c.lineWidth = 5; c.beginPath(); c.arc(-31 + ex, -405, 26, 0, 7); c.moveTo(57 + ex, -405); c.arc(31 + ex, -405, 26, 0, 7); c.moveTo(-5 + ex, -408); c.lineTo(5 + ex, -408); c.stroke(); }
  }
  if (p.hair === 'hood' && !sil) { // glowing eye in shadow
    c.save(); c.shadowColor = '#5ad0ff'; c.shadowBlur = 30; c.fillStyle = '#c9f2ff'; ell(24, -410, 13, 6); c.restore();
  }
  frontHair(p, hc, z, st);
}

function eyes(p, st, ex, z) {
  const type0 = z > .5 ? 'zombie' : (st.eyes || 'normal');
  for (const side of [-1, 1]) {
    const type = (st.redEye && side === 1) ? 'zombie' : type0;
    c.save(); c.translate(side * 31 + ex, -405);
    if (type === 'closed') {
      c.strokeStyle = '#2a1c1c'; c.lineWidth = 6; c.lineCap = 'round';
      c.beginPath(); c.arc(0, -4, 15, .2 * Math.PI, .8 * Math.PI); c.stroke();
    } else if (type === 'zombie') {
      c.shadowColor = '#ff1a1a'; c.shadowBlur = 28;
      c.fillStyle = '#ffe4e0'; ell(0, 0, 16, 18);
      c.fillStyle = '#ff1e1e'; ell(2, 2, 8, 9);
      c.shadowBlur = 0;
      c.strokeStyle = 'rgba(160,0,0,.6)'; c.lineWidth = 2; c.beginPath(); c.moveTo(-14, 2); c.lineTo(-5, 0); c.moveTo(14, 6); c.lineTo(7, 3); c.stroke();
    } else {
      const big = type === 'wide' ? 1.2 : 1, ir = type === 'wide' ? .55 : 1, lk = (st.look || 0) * 4;
      c.fillStyle = '#fff'; ell(0, 0, 16 * big, 21 * big);
      c.fillStyle = p.iris || '#3a2418'; ell(3 + lk, 3, 11 * ir, 15 * ir);
      c.fillStyle = '#120a08'; ell(3 + lk, 4, 5.5 * ir, 7.5 * ir);
      c.fillStyle = '#fff'; circ(-2 + lk, -6, 4.5 * ir + 1); circ(7 + lk, 9, 2);
      if (st.glint) { c.save(); c.shadowColor = '#8fd8ff'; c.shadowBlur = 20; c.fillStyle = '#e4f8ff'; circ(-2 + lk, -6, 6); c.restore(); }
      c.strokeStyle = '#1a1010'; c.lineWidth = 7; c.lineCap = 'round';
      c.beginPath(); c.ellipse(0, 0, 17 * big, 22 * big, 0, Math.PI * 1.08, Math.PI * 1.92); c.stroke();
      if (type === 'half') { c.fillStyle = p.skinLid || 'rgba(0,0,0,0)'; }
    }
    c.restore();
  }
  if ((st.eyes) === 'half') { c.fillStyle = mix(p.skin, '#000000', .08); for (const s of [-1, 1]) { rr(s * 31 + ex - 19, -430, 38, 20, 6); c.fill(); } }
}

function brows(st, ex, z, hc) {
  const m = z > .5 ? 'angry' : (st.brows || 'normal');
  c.strokeStyle = hc; c.lineWidth = 7; c.lineCap = 'round';
  for (const s of [-1, 1]) {
    let yi = -438, yo = -440;
    if (m === 'angry') { yi = -428; yo = -446; }
    if (m === 'sad') { yi = -450; yo = -434; }
    if (m === 'up') { yi = -452; yo = -450; }
    c.beginPath(); c.moveTo(s * 14 + ex, yi); c.quadraticCurveTo(s * 32 + ex, Math.min(yi, yo) - 6, s * 48 + ex, yo); c.stroke();
  }
}

function mouth(st, ex, z) {
  const m = z > .5 ? 'zombie' : (st.mouth || 'flat');
  const x = ex * 1.4, y = -360;
  c.lineCap = 'round'; c.strokeStyle = '#5a2a22'; c.lineWidth = 5;
  if (m === 'smile') { c.beginPath(); c.arc(x, y - 10, 16, .15 * Math.PI, .85 * Math.PI); c.stroke(); }
  else if (m === 'flat') { c.beginPath(); c.moveTo(x - 12, y); c.lineTo(x + 12, y); c.stroke(); }
  else if (m === 'sad') { c.beginPath(); c.arc(x, y + 10, 14, 1.2 * Math.PI, 1.8 * Math.PI); c.stroke(); }
  else if (m === 'o') { c.fillStyle = '#5a1f1f'; ell(x, y, 9, 12); }

function flame(x, y, sz, t, seed) {

function smoke(x, y, t, seed, col = 'rgba(30,20,22,.55)', h = 700) {

function schoolBlock(x0, y0, w, h, base, winFn) {

/* global camera shakes / flashes / glitches */
const SHAKES = [[2.4, .5, 14], [8.6, .8, 30], [32.2, .4, 16], [32.9, .4, 16], [33.6, .5, 20], [38.6, .9, 6], [39.5, 1.2, 28], [41, 1, 14], [44.2, .8, 26], [66, .4, 8], [75, 1, 14], [80, .4, 14]];

function shakeAt(t) { let a = 0; for (const [t0, d, amp] of SHAKES) if (t >= t0 && t < t0 + d) a = Math.max(a, amp * (1 - (t - t0) / d)); return a; }

const buf = document.createElement('canvas'); buf.width = W; buf.height = H; const bc = buf.getContext('2d');
const grain = []; for (let g = 0; g < 4; g++) { const n = document.createElement('canvas'); n.width = n.height = 256; const nc = n.getContext('2d'); const id = nc.createImageData(256, 256); for (let i = 0; i < id.data.length; i += 4) { const v = hash(i * .37 + g * 999) * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 22; } nc.putImageData(id, 0, 0); grain.push(n); }

function renderAt(t) {

}

/* =========================================================================
   AUDIO — fully synthesized, rendered offline so playback & export match
   ========================================================================= */
function buildAudio(ac) {
  const master = ac.createGain(); master.gain.value = .8;
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
  master.connect(comp); comp.connect(ac.destination);
  const nb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const nd = nb.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = hash(i * .013) * 2 - 1;
  function env(g, t, a, peak, dur, rel) { g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.setValueAtTime(peak, t + Math.max(a, dur - rel)); g.gain.linearRampToValueAtTime(0, t + dur); }
  function tone(t, f, dur, { type = 'sine', g = .3, a = .01, rel = dur * .8, f2 = null, dest = master, filt = null } = {}) {
    const o = ac.createOscillator(), gn = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    env(gn, t, a, g, dur, rel); let n = o;
    if (filt) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = filt; o.connect(fl); n = fl; }
    n.connect(gn); gn.connect(dest); o.start(t); o.stop(t + dur + .05);
  }
  function noise(t, dur, { g = .3, type = 'bandpass', f = 1000, f2 = null, q = 1, a = .01, rel = dur * .8 } = {}) {
    const s = ac.createBufferSource(); s.buffer = nb; s.loop = true;
    const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t); fl.Q.value = q;
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const gn = ac.createGain(); env(gn, t, a, g, dur, rel);
    s.connect(fl); fl.connect(gn); gn.connect(master); s.start(t, hash(t) * 1.5); s.stop(t + dur + .05);
  }
  const boom = (t, g = .9) => { tone(t, 120, 1.4, { g, f2: 30, rel: 1.3 }); noise(t, .8, { g: g * .5, type: 'lowpass', f: 400, f2: 60 }); };
  const heart = (t, g = .8) => { tone(t, 62, .16, { g, f2: 40 }); tone(t + .2, 55, .14, { g: g * .7, f2: 38 }); };
  const whoosh = (t, d = .6, g = .35) => noise(t, d, { g, f: 300, f2: 3500, q: 2, a: d * .7, rel: d * .3 });
  const riser = (t, d) => { noise(t, d, { g: .25, f: 200, f2: 6000, q: 3, a: d * .95, rel: .05 }); tone(t, 200, d, { type: 'sawtooth', g: .05, f2: 1200, a: d * .9, rel: .05, filt: 2500 }); };
  const tick = (t, g = .25) => noise(t, .03, { g, type: 'highpass', f: 3500, a: .002, rel: .025 });
  const glitch = (t, d) => { for (let i = 0; i < d * 30; i++) tone(t + i / 30, 200 + hash(t * 10 + i) * 1800, .025, { type: 'square', g: .07, a: .001, rel: .01 }); };
  const growl = (t, d) => { const o = ac.createOscillator(), l = ac.createOscillator(), lg = ac.createGain(), gn = ac.createGain(), fl = ac.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = 75; l.frequency.value = 23; lg.gain.value = 30; l.connect(lg); lg.connect(o.frequency);

function audioBufferToWav(abuf) {
  const nCh = abuf.numberOfChannels, len = abuf.length, sr = abuf.sampleRate;

  const ws = (o, s) => { for (let i = 0; i < s.length; i++) out.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); out.setUint32(4, 36 + len * nCh * 2, true); ws(8, 'WAVE'); ws(12, 'fmt '); out.setUint32(16, 16, true);
  out.setUint16(20, 1, true); out.setUint16(22, nCh, true); out.setUint32(24, sr, true); out.setUint32(28, sr * nCh * 2, true);
  out.setUint16(32, nCh * 2, true); out.setUint16(34, 16, true); ws(36, 'data'); out.setUint32(40, len * nCh * 2, true);
  const chans = [...Array(nCh)].map((_, i) => abuf.getChannelData(i)); let o = 44;

  return out.buffer;
}
async function renderAudio() {
  const sr = 44100; const oac = new OfflineAudioContext(2, Math.ceil(sr * TOTAL), sr);
  buildAudio(oac); return oac.startRendering();
}

const params = new URLSearchParams(location.search);
const exportMode = params.has('export');

let audioBuf = null, actx = null, src = null, playing = false, offset = 0, startedAt = 0, perfStart = 0;
const $ = id => document.getElementById(id);
